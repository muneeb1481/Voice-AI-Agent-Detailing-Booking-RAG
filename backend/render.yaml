services:
  - type: web
    name: shinepro-detailing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: kimi-k3
      - key: KIMI_REASONING_EFFORT
        value: low
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: VAPI_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BRAND_NAME
        value: ShinePro Detailing
