<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1220'/><text x='50' y='68' font-family='Arial, sans-serif' font-weight='800' font-size='52' fill='%2338bdf8' text-anchor='middle'>SP</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShinePro Detailing · Admin</title>
    <script>
      // Applied before paint so there is no theme flash on load.
      try {
        const t = localStorage.getItem('theme') ?? 'dark'
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
